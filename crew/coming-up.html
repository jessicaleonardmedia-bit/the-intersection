<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Coming up - The Intersection crew</title>
<link rel="preload" href="/fonts/Overpass-Black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Overpass-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
  [hidden] { display: none !important; }
  .crew { max-width: 760px; margin: 0 auto; padding: var(--pad); }
  .crew .lead { font-size: 1.15rem; margin-bottom: 1.5rem; }
  .crew-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1.5rem 0; }
  .crew-status { padding: 1rem 1.25rem; border: var(--rule); background: var(--tint-blue); }
  .day { margin: 2rem 0 0; }
  .day h2 { font-size: 1.3rem; display: inline-block; background: var(--yellow); padding: 0.2rem 0.6rem; border: 3px solid var(--black); }
  .posts { list-style: none; margin: 0.75rem 0 0; padding: 0; display: grid; gap: 0.75rem; }
  .post { border: var(--rule); box-shadow: var(--shadow-sm); padding: 1rem 1.25rem; background: var(--white); }
  .post h3 { font-size: 1.15rem; margin: 0 0 0.4rem; }
  .post p { margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; padding: 0; list-style: none; }
  .tags li { background: var(--pink-pale); border: 2px solid var(--black); padding: 0.1rem 0.5rem; font-size: 0.9rem; }
  .tags li.pillar { background: var(--tint-blue); }
  .post-image { display: block; width: 100%; max-width: 320px; margin: 0.8rem 0 0; border: 3px solid var(--black); }
  .caption { margin-top: 0.9rem; }
  .caption summary { cursor: pointer; font-weight: 700; }
  .caption p { margin: 0.6rem 0 0; white-space: pre-line; }
</style>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<main id="main" class="crew" tabindex="-1">
  <h1>Coming up</h1>
  <p class="lead">Social posts that are approved or scheduled, soonest first. Have a look, and read the captions, before you make something new, so we don't double up.</p>

  <div class="crew-actions">
    <button class="btn" id="loginBtn" type="button" hidden>Log in</button>
    <a class="btn btn--yellow" id="dashLink" href="/admin/" hidden>Website dashboard</a>
    <button class="btn btn--yellow" id="logoutBtn" type="button" hidden>Log out</button>
  </div>

  <p class="crew-status" id="status" role="status" aria-live="polite">Checking your login…</p>
  <div id="list"></div>
</main>

<script>
(function () {
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('list');
  var loginBtn = document.getElementById('loginBtn');
  var logoutBtn = document.getElementById('logoutBtn');
  var dashLink = document.getElementById('dashLink');
  var id = window.netlifyIdentity;

  function rolesOf(user) {
    return (user && user.app_metadata && user.app_metadata.roles) || [];
  }

  function say(text) {
    statusEl.textContent = text;
    statusEl.hidden = !text;
  }

  function niceDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function render(posts) {
    listEl.innerHTML = '';
    if (!posts.length) {
      say('Nothing is approved yet. Check with your producer about what is needed.');
      return;
    }
    say('');
    var current = null, ul = null;
    posts.forEach(function (post) {
      if (post.date !== current) {
        current = post.date;
        var section = el('section', 'day');
        section.appendChild(el('h2', null, niceDate(post.date)));
        ul = el('ul', 'posts');
        section.appendChild(ul);
        listEl.appendChild(section);
      }
      var li = el('li', 'post');
      li.appendChild(el('h3', null, post.title || 'Untitled post'));
      var tags = el('ul', 'tags');
      tags.setAttribute('aria-label', 'Details');
      if (post.pillar) tags.appendChild(el('li', 'pillar', post.pillar));
      if (post.contentType) tags.appendChild(el('li', null, post.contentType));
      post.platforms.forEach(function (p) { tags.appendChild(el('li', null, p)); });
      if (tags.children.length) li.appendChild(tags);
      if (post.image) {
        var img = el('img', 'post-image');
        img.src = post.image;
        img.alt = post.alt || ('Image for ' + (post.title || 'this post'));
        img.loading = 'lazy';
        img.onerror = function () { img.remove(); };
        li.appendChild(img);
      }
      if (post.caption) {
        var details = el('details', 'caption');
        details.appendChild(el('summary', null, 'Read the caption'));
        details.appendChild(el('p', null, post.caption));
        li.appendChild(details);
      }
      ul.appendChild(li);
    });
  }

  function loggedOut() {
    listEl.innerHTML = '';
    loginBtn.hidden = false;
    logoutBtn.hidden = true;
    dashLink.hidden = true;
    say('Log in with your crew email and password to see what is coming up.');
  }

  function loggedIn(user) {
    var roles = rolesOf(user);
    loginBtn.hidden = true;
    logoutBtn.hidden = false;
    if (roles.indexOf('Executive Producer') !== -1) { dashLink.href = '/admin/'; dashLink.hidden = false; }
    else if (roles.indexOf('Content Admin') !== -1) { dashLink.href = '/content-admin/'; dashLink.hidden = false; }
    say('Loading…');
    user.jwt().then(function (token) {
      return fetch('/.netlify/functions/coming-up', { headers: { Authorization: 'Bearer ' + token } });
    }).then(function (res) {
      if (res.status === 403) { say('Your login works, but your access is not set up yet. Ask your producer.'); return null; }
      if (res.status === 401) { loggedOut(); return null; }
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }).then(function (data) {
      if (data) render(data.posts || []);
    }).catch(function () {
      say('Something went wrong loading the list. Try again later, or tell your producer.');
    });
  }

  loginBtn.addEventListener('click', function () { id.open('login'); });
  logoutBtn.addEventListener('click', function () { id.logout(); });

  id.on('init', function (user) { user ? loggedIn(user) : loggedOut(); });
  id.on('login', function (user) { id.close(); loggedIn(user); });
  id.on('logout', loggedOut);
})();
</script>

</body>
</html>
